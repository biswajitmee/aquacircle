<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>AquaCircle form registration</title>
  </head>
  <body>
    <!-- Netlify scans this static file. All React forms submit these same fields. -->
    <form name="aquacircle-service-request" method="POST" data-netlify="true" data-netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="aquacircle-service-request" />
      <input type="hidden" name="subject" value="New AquaCircle Service Request" />
      <input name="reference" />
      <input name="requestId" />
      <input name="name" />
      <input name="mobile" type="tel" />
      <input name="pin" />
      <input name="service" />
      <input name="serviceType" />
      <input name="email" type="email" />
      <input name="brand" />
      <input name="model" />
      <input name="address" />
      <input name="serviceLocation" />
      <input name="latitude" />
      <input name="longitude" />
      <input name="locationAccuracy" />
      <input name="locationSource" />
      <input name="googleMaps" />
      <textarea name="serviceLocationDetails"></textarea>
      <input name="preferredDate" />
      <input name="preferredTime" />
      <textarea name="problem"></textarea>
      <input name="consent" />
      <input name="submittedAt" />
      <input name="submissionDate" />
      <input name="source" />
      <input name="sourceLocation" />
      <input name="website" />
    </form>
  </body>
</html>
