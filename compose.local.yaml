services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aquacircle
      POSTGRES_USER: aquacircle
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - local-database:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  local-database:
