services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aquacircle
      POSTGRES_USER: aquacircle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquacircle -d aquacircle"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: .
      target: runner
      args:
        SITE_URL: ${SITE_URL:-https://aquacircle.in}
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://aquacircle:${POSTGRES_PASSWORD}@database:5432/aquacircle
      LOCAL_DEVELOPMENT: "0"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build:
      context: .
      target: worker
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://aquacircle:${POSTGRES_PASSWORD}@database:5432/aquacircle
      LOCAL_DEVELOPMENT: "0"
    depends_on:
      database:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
